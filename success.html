<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>支付成功</title>
</head>

<body>

<h1>支付成功！</h1>

<script>

fetch("/api/save-payment", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    email: "test@test.com",
    amount: "9.9",
    status: "paid"
  })
})
.then(res => res.json())
.then(data => {
  console.log("保存成功", data);
})
.catch(err => {
  console.log(err);
});

</script>

</body>
</html>
